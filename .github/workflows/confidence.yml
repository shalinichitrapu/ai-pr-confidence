name: AI change confidence

on:
  pull_request:
    # labeled/unlabeled: rescore when a reviewer adds or removes a confidence-ack:<key> label
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  score:
    # Every event rescores, including unrelated labels: a skipped job would show
    # as a passing check and could hide a failing score. One run per pull
    # request at a time; a newer event cancels an older run, so a slow run that
    # started before a label change can't overwrite the newer score.
    concurrency:
      group: confidence-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the agent needs the base branch history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest-xdist is only for the agent's own tests of parallel test runs.
      - run: pip install -r requirements.txt pytest-xdist

      # GitHub's runners can't reach the model on your home desktop, so CI posts
      # the score without the plain-English summary. Run scripts/score_pr.sh on
      # your Mac to post the same comment with the local model's summary.
      - name: Reuse base-branch test results between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/confidence-agent
          key: confidence-base-${{ runner.os }}-${{ github.event.pull_request.base.sha }}
          restore-keys: confidence-base-${{ runner.os }}-

      - name: Score this pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m confidence_agent \
            --base origin/${{ github.base_ref }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --source studybuddy,confidence_agent \
            --no-llm \
            --post-to-pr ${{ github.event.pull_request.number }}

      # Also show the report on the run's summary page. Pull requests from forks
      # get a read-only token, so this is where their report appears.
      - name: Add report to job summary
        if: always()
        run: cat confidence-report/report.md >> "$GITHUB_STEP_SUMMARY" || true
